name: Build DocIntel for Windows

# Runs automatically when files are uploaded to the repository, or by clicking "Run workflow" on the Actions page.
on:
  push:
  workflow_dispatch:

permissions:
  contents: write        # lets the build publish the finished files on the repository's "Releases" page

jobs:
  windows:
    runs-on: windows-2022
    timeout-minutes: 90
    env:
      PYTHONUTF8: "1"
      DOCINTEL_VERSION: "1.0.0"
    steps:
      - name: Get the source
        uses: actions/checkout@v4

      - name: Unpack the source package (when the source was uploaded as a single zip)
        run: |
          if (Test-Path DocIntel_Source.zip) { Expand-Archive DocIntel_Source.zip -DestinationPath . -Force }
          Get-ChildItem | Select-Object -First 40 | Format-Table Name

      - name: Set up 64-bit Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          architecture: x64
          cache: pip

      - name: Install Python libraries
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements-dev.txt -c constraints.txt
          if ($LASTEXITCODE -ne 0) { Write-Host "Pinned versions unavailable; using latest compatible"; python -m pip install -r requirements-dev.txt }
          python -m pip list

      - name: Get the Tesseract OCR program (pinned, checksum-verified)
        run: ./tools/fetch_tesseract.ps1

      - name: Put OCR + language files where the tests expect them
        run: |
          New-Item -ItemType Directory -Force tesseract\tessdata | Out-Null
          Copy-Item "$env:TESS_DIR\tesseract.exe" tesseract\
          Copy-Item "$env:TESS_DIR\*.dll" tesseract\
          Copy-Item "$env:TESS_DIR\tessdata\configs" tesseract\tessdata\configs -Recurse
          Copy-Item "$env:TESS_DIR\tessdata\tessconfigs" tesseract\tessdata\tessconfigs -Recurse
          python tools/download_models.py tesseract\tessdata
          .\tesseract\tesseract.exe --list-langs

      - name: Windows automated tests
        id: tests
        continue-on-error: true
        run: python -m pytest tests -q -p no:cacheprovider --junitxml=test-results-windows.xml

      - name: Build the application, portable zip and installer
        id: build
        run: |
          python tools/make_user_guide.py
          if (-not (Test-Path "C:\Program Files (x86)\Inno Setup 6\ISCC.exe")) { choco install innosetup -y --no-progress --limit-output }
          python tools/make_release.py --version $env:DOCINTEL_VERSION --tess-dir $env:TESS_DIR --out dist

      - name: "Check: portable zip (unzipped into a folder with spaces, run from there)"
        id: portable
        continue-on-error: true
        run: |
          $dest = "C:\Test Area\Portable Copy"
          New-Item -ItemType Directory -Force $dest | Out-Null
          Expand-Archive dist\DocIntel_Portable_Windows_x64.zip -DestinationPath $dest -Force
          python tools/smoke_packaged.py "$dest\DocIntel" --expect-portable --report smoke-portable.json

      - name: "Check: portable app with ALL network access blocked by the Windows firewall"
        id: offline
        continue-on-error: true
        run: |
          $app = "C:\Test Area\Portable Copy\DocIntel"
          foreach ($e in "DocIntel.exe","docintel-cli.exe","tesseract\tesseract.exe") {
            New-NetFirewallRule -DisplayName "Block $e" -Direction Outbound -Program "$app\$e" -Action Block | Out-Null
            New-NetFirewallRule -DisplayName "Block in $e" -Direction Inbound -Program "$app\$e" -Action Block | Out-Null
          }
          Remove-Item "$app\DocIntel_Data" -Recurse -Force -ErrorAction SilentlyContinue
          python tools/smoke_packaged.py $app --expect-portable --report smoke-offline.json

      - name: "Check: silent install, run installed app, uninstall"
        id: installer
        continue-on-error: true
        run: |
          $dir = "$env:LOCALAPPDATA\Programs\DocIntel Test"
          $p = Start-Process dist\DocIntel_Setup.exe -ArgumentList "/VERYSILENT","/SUPPRESSMSGBOXES","/NORESTART","/CURRENTUSER","/TASKS=desktopicon","/DIR=`"$dir`"" -Wait -PassThru
          if ($p.ExitCode -ne 0) { throw "installer exit code $($p.ExitCode)" }
          if (-not (Test-Path "$dir\DocIntel.exe")) { throw "DocIntel.exe was not installed" }
          $lnk = Get-ChildItem "$env:APPDATA\Microsoft\Windows\Start Menu\Programs" -Filter "DocIntel*.lnk" -ErrorAction SilentlyContinue
          if (-not $lnk) { throw "Start Menu shortcut missing" }
          if (-not (Test-Path "$([Environment]::GetFolderPath('Desktop'))\DocIntel.lnk")) { throw "Desktop shortcut missing" }
          python tools/smoke_packaged.py $dir --default-data-dir --report smoke-installed.json
          $smoke = $LASTEXITCODE
          $u = Start-Process "$dir\unins000.exe" -ArgumentList "/VERYSILENT","/SUPPRESSMSGBOXES","/NORESTART" -Wait -PassThru
          Start-Sleep 3
          if (Test-Path "$dir\DocIntel.exe") { throw "uninstall left DocIntel.exe behind" }
          if ($smoke -ne 0) { throw "smoke tests of installed app failed" }

      - name: Write build verdict
        if: always()
        run: |
          $r = [ordered]@{
            "Windows automated tests"                  = "${{ steps.tests.outcome }}"
            "Build (app + portable zip + installer)"   = "${{ steps.build.outcome }}"
            "Portable zip check"                       = "${{ steps.portable.outcome }}"
            "Offline (firewall-blocked) check"         = "${{ steps.offline.outcome }}"
            "Install / run / uninstall check"          = "${{ steps.installer.outcome }}"
          }
          $lines = $r.GetEnumerator() | ForEach-Object { "{0,-42} {1}" -f $_.Key, $_.Value.ToUpper() }
          $txt = "DocIntel $env:DOCINTEL_VERSION - Windows build $env:GITHUB_RUN_NUMBER`r`n" + ($lines -join "`r`n") + "`r`n`r`nSUCCESS = ran and passed on a real Windows machine.  FAILURE = see the step log.`r`n"
          $txt | Out-File dist\BUILD_RESULT.txt -Encoding utf8
          $txt | Out-File $env:GITHUB_STEP_SUMMARY -Encoding utf8 -Append
          Copy-Item test-results-windows.xml,smoke-*.json dist\ -ErrorAction SilentlyContinue
          if ($r.Values -contains "failure") { Write-Host "ONE OR MORE CHECKS FAILED"; "BUILD_PROBLEMS=1" | Out-File $env:GITHUB_ENV -Append -Encoding utf8 }

      - name: Keep the finished files (Artifacts)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: DocIntel-Windows-build-${{ github.run_number }}
          path: |
            dist/DocIntel_Setup.exe
            dist/DocIntel_Portable_Windows_x64.zip
            dist/DocIntel_Offline_Resources.zip
            dist/SHA256SUMS.txt
            dist/BUILD_RESULT.txt
            dist/test-results-windows.xml
            dist/smoke-*.json
            docs/DocIntel_User_Guide.pdf
          if-no-files-found: warn
          retention-days: 90

      - name: Publish on the Releases page (easiest place to download from)
        if: always() && steps.build.outcome == 'success'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ github.run_number }}
          name: DocIntel for Windows - build ${{ github.run_number }}
          body_path: dist/BUILD_RESULT.txt
          prerelease: ${{ env.BUILD_PROBLEMS == '1' }}
          files: |
            dist/DocIntel_Setup.exe
            dist/DocIntel_Portable_Windows_x64.zip
            dist/DocIntel_Offline_Resources.zip
            dist/SHA256SUMS.txt
            dist/BUILD_RESULT.txt
            docs/DocIntel_User_Guide.pdf

      - name: Final verdict
        if: always()
        run: |
          if ($env:BUILD_PROBLEMS -eq "1" -or "${{ steps.build.outcome }}" -ne "success") { Write-Host "Build finished with problems - see BUILD_RESULT.txt"; exit 1 }
